<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handmade Bliss | Wishlist</title>
    <link rel="stylesheet" href="wishlist.css">
</head>
<body>
    <header class="site-header"><nav class="nav-shell"><a class="brand" href="product-detail.html"><span class="brand-mark">HB</span><span>Handmade <em>Bliss</em></span></a><div class="header-actions"><button class="account-button" type="button" id="account-button" aria-expanded="false" aria-controls="account-panel">Account</button><a class="continue-link" href="product-detail.html">Continue shopping</a></div></nav></header>
    <main class="wishlist-shell">
        <p class="eyebrow">Handmade Bliss</p>
        <h1>Your wishlist</h1>
        <p class="wishlist-subtitle" id="wishlist-subtitle"></p>
        <section id="wishlist-content" aria-live="polite"></section>
    </main>
    <aside class="account-panel" id="account-panel" aria-label="Account" hidden><div class="account-panel-header"><div><p class="eyebrow">Your account</p><h2>Account access</h2></div><button class="account-close" type="button" id="account-close" aria-label="Close account details">&times;</button></div><div id="account-content"></div></aside>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="api-config.js"></script>
    <script src="account.js"></script>
    <script src="wishlist.js"></script>
</body>
</html>
